name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m pytest --cov=authlens --cov-report=term-missing --cov-report=xml
      - run: python -m build --no-isolation
      - name: Verify wheel in isolated environment
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys, tempfile, venv
          root = pathlib.Path.cwd()
          wheel = next((root / 'dist').glob('*.whl'))
          with tempfile.TemporaryDirectory() as directory:
              env = pathlib.Path(directory) / 'env'
              venv.create(env, with_pip=True)
              python = env / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', '--no-index', '--no-deps', str(wheel)], check=True)
              result = subprocess.run([str(python), '-m', 'authlens', 'analyze', str(root / 'examples/events.jsonl'), '--lang', 'zh-CN', '--format', 'json'], cwd=directory, check=True, capture_output=True, encoding='utf-8')
              assert len(json.loads(result.stdout)['findings']) == 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
