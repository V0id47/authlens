name: Build release candidate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e .
      - name: Check requested tag matches package
        shell: python
        run: |
          import os
          from authlens import __version__
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__
      - run: python -m ruff check src tests scripts evaluation
      - run: python -m ruff format --check src tests scripts evaluation
      - run: python -m pytest --cov=authlens
      - run: python -m bandit -r src -q
      - run: python -m build --no-isolation
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authlens-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
