name: Bug report
description: Report a reproducible defect using synthetic input only.
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, follow SECURITY.md. **Do not upload real authentication logs, usernames, IPs, credentials or other sensitive evidence.** Use synthetic input only and remove secrets from commands.
  - type: textarea
    id: reproduction
    attributes:
      label: Version, OS/Python, command and synthetic input
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual output / exit code
    validations:
      required: true
